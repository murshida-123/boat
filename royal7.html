<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal 7 | Gallery</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: linear-gradient(to bottom right, #001f3f, #004080);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px;
    flex-direction: column;
  }

  .container {
    text-align: center;
    width: 100%;
    max-width: 600px;
    animation: fadein 1.2s ease;
  }
 
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

  .gallery img {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), 0 0 15px rgba(255, 255, 255, 0.1);
    border: 3px solid #004aad;
    transition: all 0.4s ease;
    cursor: pointer;
    margin-top: 20px;
  }

  .gallery img:hover {
    transform: scale(1.05);
    filter: brightness(1.05) contrast(1.1);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
  }

  .caption h1 {
    color: #FFD700;
    font-size: 1.8rem;
    margin-top: 20px;
  }

  .btn, .back-btn {
    display: inline-block;
    margin: 15px 10px;
    padding: 12px 25px;
    background-color: #FFD700;
    color: #001f3f;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    transition: background 0.3s, transform 0.2s;
  }

  .btn:hover, .back-btn:hover {
    background-color: #e6c200;
    transform: scale(1.05);
  }

  @media (max-width: 600px) {
    .caption h1 {
      font-size: 1.4rem;
    }
    .btn, .back-btn {
      display: block;
      width: 80%;
      margin: 10px auto;
    }
  }
</style>
    

  </style>
</head>
<body>

  <div class="container">
    <div class="caption">
      <h1>Royal 7 — Luxury Yacht</h1>
      
    </div>
    <div class="gallery">
      <img src="royal7.jpg" alt="Royal7 Boat">
    </div>

    
  </div>
    <a href="booking.html" class="btn">Book Now</a>

    <a href="boats.html" class="back-btn">← Back to Ad-Boats</a>


</body>
</html>
