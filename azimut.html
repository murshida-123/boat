<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azimut</title>
  <style>
    /* General page setup */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom right, #001f3f, #004080);
      margin: 0;
      padding: 40px 0;
    }

    /* Title styling */
    h1 {
      text-align: center;
      color: #FFD700;
      margin:30px 0 40px;
      letter-spacing: 1px;
      font-size: 2rem;
    }

    /* Gallery layout */
    .gallery {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 20px;
    }

    /* Image styling */
    .gallery img {
      width: 400px;
      height: 300px;
      object-fit: cover;
      border: 2px solid #111827;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
    }

    /* Hover effect */
    .gallery img:hover {
      filter: grayscale(1);
      transform: scale(1.03);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .gallery img {
        width: 90%;
        height: auto;
      }
    }
        .btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #e6c200;
      transform: scale(1.05);
    }
        .back-btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background-color: #e6c200;
    }
  </style>
</head>
<body>
  <h1>Azimut Yacht</h1>
  <div class="gallery">
    <img src="azimut.jpg" alt="Azimut yacht exterior">
    <img src="azimut1.jpg" alt="Azimut yacht interior">
    <img src="azimut2.jpg" alt="Azimut yacht interior">
    <img src="azimut3.jpg" alt="Azimut yacht interior">
    <img src="azimut4.jpg" alt="Azimut yacht interior">
  </div>
    <a href="booking.html" class="btn">Book Now</a>

    <a href="boats.html" class="back-btn">← Back to Ad-Boats</a>

</body>
</html>
