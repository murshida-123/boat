<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malak | Royal Boat Marine</title>

  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f5f8fc;
      color: #001f3f;
      overflow-x: hidden;
    }

    .nav-links {
      list-style: none;
      display: flex;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 100;
      color: #001f3f;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #d4af37;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 10px 10px 20px;
      background: linear-gradient(to right, #001f3f, #003366);
      color: white;
      animation: fadeIn 1.2s ease;
    }

    .hero h1 {
      font-size: 1.8em;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 1.1em;
      color: #f0f0f0;
    }

    /* Image Highlight */
    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 20px;
      background: #fff;
      animation: fadeUp 1.2s ease;
    }

    .image-container img {
      width: 75%;
      max-width: 750px;
      height: auto;
      border-radius: 16px;
      border: 3px solid #d4af37;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25);
      transition: 0.4s ease;
    }

    .image-container img:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      border-color: #f2c94c;
    }

    /* Caption */
    .caption {
      text-align: center;
      margin-top: 15px;
      font-size: 1.2em;
      font-weight: 600;
      color: #001f3f;
      letter-spacing: 0.5px;
    }

    /* Footer */
    footer {
      background: #001f3f;
      color: white;
      text-align: center;
      padding: 35px 15px;
      margin-top: 60px;
    }

    footer p {
      font-size: 0.9em;
      color: #ccc;
    }

    /* Animations */
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes fadeUp {
      from {opacity: 0; transform: translateY(40px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2em;
      }

      .image-container img {
        width: 90%;
      }
    }
    .btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 10px 15px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #e6c200;
      transform: scale(1.05);
    }

    .back-btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 10px 5px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background-color: #e6c200;
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1>Malak Luxury Boat</h1>
    <p>Experience timeless elegance and cutting-edge marine design</p>
  </section>
  <!-- Hero Image -->
  <section class="image-container">
    <img src="malak.jpg" alt="Malak Boat">
  </section>
  <div class="caption">Malak — A symbol of luxury and marine excellence</div>
 <a href="booking.html" class="btn">Book Now</a>
  <a href="boats.html" class="back-btn">← Back to Ad-Boats</a>
  <!-- Footer -->
  <footer>
    <p>© 2025 Royal Boat Marine | All Rights Reserved</p>
  </footer>
    
</body>
</html>
