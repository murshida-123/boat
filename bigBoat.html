<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBoat</title>
    <style>
        body{
                  background: linear-gradient(to bottom right, #001f3f, #004080);

        }
        h1 {
  color: #FFD700;
  font-size: 2rem;
  margin: 30px 0 40px; /* Added space below heading */
  text-align: center;
  letter-spacing: 1px;
  font-family: "Poppins", sans-serif;
}
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        div img{
            width: 400px;
            height: 300px;
            border: 2px solid #111827;
            border-radius: 13px;
            box-shadow: 4px 7px 7px 0px #31212142;
            cursor: pointer;
            margin: 10px;
            transition: 400ms;
        }
        div img:hover{
            filter: grayscale(1);
            transform: scale(1.03);
        }
        .btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #e6c200;
      transform: scale(1.05);
    }
            .back-btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background-color: #e6c200;
    }
    </style>
</head>
<body>
    <h1>BigBoat</h1>
    <div>
                <img src="bigboat.jpg" alt="bigboat-interior">
        <img src="bigboat1.jpg" alt="bigboat-interior">
                <img src="bigboat2.jpg" alt="bigboat-interior">
                        <img src="bigboat3.jpg" alt="bigboat-interior">
                                <img src="bigboat4.jpg" alt="bigboat-interior">
                                        <img src="bigboat5.jpg" alt="bigboat-interior">
                        <img src="bigboat6.jpg" alt="bigboat-interior">
                                <img src="bigboat7.jpg" alt="bigboat-interior">
                                                                  <img src="bigboat8.jpg" alt="bigboat-interior">

    </div>
      <a href="booking.html" class="btn">Book Now</a>

      <a href="boats.html" class="back-btn">← Back to Ad-Boats</a>

</body>
</html>
