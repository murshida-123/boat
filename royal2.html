<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal 2 | Gallery</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #001f3f, #004080);
      margin: 0;
      padding: 40px 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    .gallery img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      filter: brightness(0.9);
    }

    /* Lightbox overlay */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .lightbox.active {
      display: flex;
    }

    .close-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      .gallery img {
        height: 200px;
      }
    }
    .btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: #e6c200;
      transform: scale(1.05);
    }

     .back-btn {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 180px;
      padding: 12px 25px;
      background-color: #FFD700;
      color: #001f3f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background-color: #e6c200;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center; color: #FFD700; margin-bottom:30px;">Royal 2 Yacht Gallery</h2>

  <div class="gallery">
    <img src="royal2.jpg" alt="royal2-interior">
    <img src="royal2-1.jpg" alt="royal2-interior">
    <img src="royal2-3.jpg" alt="royal2-interior">
    <img src="royal2-2.jpg" alt="royal2-interior">
    <img src="royal2-6.jpg" alt="royal2-interior">
    <img src="royal2-7.jpg" alt="royal2-interior">
    <img src="royal2-5.jpg" alt="royal2-interior">
    <img src="royal2-8.jpg" alt="royal2-interior">
    <img src="royal2-4.jpg" alt="royal2-interior">
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close-btn" id="closeBtn">&times;</span>
    <img src="" alt="Expanded view" id="lightboxImg" />
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeBtn');
    const images = document.querySelectorAll('.gallery img');

    images.forEach(img => {
      img.addEventListener('click', () => {
        lightbox.classList.add('active');
        lightboxImg.src = img.src;
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg) {
        lightbox.classList.remove('active');
      }
    });
  </script>
    <a href="booking.html" class="btn">Book Now</a>

  <a href="services.html" class="back-btn">← Back to Service</a>

</body>
</html>
